<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>小枢 · 能说会做的 AI 智能体</title>
<style>
  /* ---------- 主题变量：浅色（默认） ---------- */
  :root {
    --bg: #f7f8fa;
    --panel: #ffffff;
    --panel-2: #fafbfc;
    --border: #e7e9ee;
    --text: #1f2329;
    --text-2: #454b57;
    --muted: #9399a3;
    --brand: #3b6fe0;
    --brand-strong: #3162c9;
    --brand-soft: #eef3fd;
    --brand-line: #d3e0f9;
    --ok: #229a68;
    --err: #d0453e;
    --err-soft: #fdecec;
    --warn-bg: #fff8e6;
    --warn-line: #f0e4b8;
    --warn-text: #7a5d14;
    --chip-text: #4a5160;
    --code-bg: #f2f4f7;
    --code-text: #33405a;
    --hover-bg: #f2f4f7;
    --mask: rgba(24, 30, 42, .42);
    --shadow-bubble: 0 1px 2px rgba(20, 25, 40, .03);
    --shadow-composer: 0 4px 14px rgba(20, 25, 40, .06);
    --shadow-dialog: 0 16px 48px rgba(0,0,0,.18);
    --scroll: #dfe2e8;
    --scroll-hover: #c9ced8;
    --radius: 14px;
  }
  /* ---------- 深色主题 ---------- */
  [data-theme="dark"] {
    --bg: #14161b;
    --panel: #1d2027;
    --panel-2: #22252d;
    --border: #2e333d;
    --text: #e7e9ee;
    --text-2: #c3c8d1;
    --muted: #8a909c;
    --brand: #6f97f2;
    --brand-strong: #86a9f5;
    --brand-soft: #24304d;
    --brand-line: #33436b;
    --ok: #3dbb85;
    --err: #e0655f;
    --err-soft: #3a2426;
    --warn-bg: #2e2a1c;
    --warn-line: #4d4423;
    --warn-text: #d8bc6a;
    --chip-text: #c3c8d1;
    --code-bg: #171a20;
    --code-text: #b9c4de;
    --hover-bg: #262a33;
    --mask: rgba(0, 0, 0, .55);
    --shadow-bubble: 0 1px 2px rgba(0, 0, 0, .25);
    --shadow-composer: 0 4px 14px rgba(0, 0, 0, .35);
    --shadow-dialog: 0 16px 48px rgba(0,0,0,.5);
    --scroll: #3a404c;
    --scroll-hover: #4a5160;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; height: 100vh; display: flex;
    font-family: -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    color: var(--text); background: var(--bg); font-size: 14px;
    transition: background .2s ease, color .2s ease;
  }

  /* ---------- 侧边栏 ---------- */
  aside {
    width: 264px; flex-shrink: 0; background: var(--panel);
    border-right: 1px solid var(--border); display: flex; flex-direction: column;
    z-index: 30;
  }
  .brand { padding: 20px 20px 16px; border-bottom: 1px solid var(--border); }
  .brand .logo {
    width: 34px; height: 34px; border-radius: 10px;
    background: linear-gradient(135deg, #3b6fe0, #7ba3f0);
    display: inline-flex; align-items: center; justify-content: center;
    color: #fff; font-size: 16px; margin-right: 10px; vertical-align: middle;
    box-shadow: 0 4px 10px rgba(59,111,224,.25);
  }
  .brand h1 { display: inline-block; margin: 0; font-size: 15px; vertical-align: middle; }
  .brand .sub { margin: 10px 0 0; font-size: 12px; color: var(--muted); display: flex; align-items: center; gap: 6px; }
  .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--ok); display: inline-block; }
  .sec { padding: 16px 20px; }
  .sec + .sec { border-top: 1px solid var(--border); }
  .sec h2 {
    margin: 0 0 10px; font-size: 11px; color: var(--muted);
    font-weight: 600; letter-spacing: 1.5px;
  }
  .btn {
    border: 1px solid var(--border); background: var(--panel); border-radius: 10px;
    padding: 8px 14px; cursor: pointer; font-size: 13px; color: var(--text);
    transition: all .15s ease;
  }
  .btn:hover { border-color: var(--brand); color: var(--brand); }
  .btn-primary { background: var(--brand); color: #fff; border-color: var(--brand); }
  .btn-primary:hover { background: var(--brand-strong); color: #fff; }
  .btn-ghost { border-color: transparent; background: var(--bg); }
  .tools { display: flex; flex-direction: column; gap: 6px; overflow-y: auto; }
  .tool {
    display: flex; align-items: center; gap: 8px; padding: 7px 10px;
    border-radius: 9px; border: 1px solid transparent;
  }
  .tool:hover { background: var(--bg); border-color: var(--border); }
  .tool code {
    background: var(--brand-soft); color: var(--brand);
    padding: 2px 6px; border-radius: 6px; font-size: 12px; white-space: nowrap;
  }
  .tool .desc { color: var(--muted); font-size: 12px; line-height: 1.4; flex: 1; }
  .badge-danger {
    background: var(--err-soft); color: var(--err); padding: 1px 6px;
    border-radius: 6px; font-size: 11px; flex-shrink: 0;
  }
  .keyinput {
    width: 100%; border: 1px solid var(--border); border-radius: 10px;
    padding: 8px 10px; font-size: 12px; outline: none; margin-bottom: 8px;
    font-family: inherit; color: var(--text); background: var(--panel);
  }
  .keyinput:focus { border-color: var(--brand); box-shadow: 0 0 0 3px var(--brand-soft); }
  .keyhint { margin: 0; font-size: 11px; color: var(--muted); line-height: 1.6; }
  .keystate { margin: 7px 0 0; font-size: 11px; color: var(--ok); line-height: 1.5; }

  /* ---------- 主区 ---------- */
  main { flex: 1; display: flex; flex-direction: column; min-width: 0; }
  header {
    padding: 14px 24px; background: var(--panel); border-bottom: 1px solid var(--border);
    display: flex; align-items: center; justify-content: space-between; gap: 10px;
  }
  header .title { font-size: 14px; font-weight: 600; }
  header .hint { font-size: 12px; color: var(--muted); }

  #chat { flex: 1; overflow-y: auto; padding: 28px 24px 16px; }
  .wrap { max-width: 760px; margin: 0 auto; }

  /* 空状态 / 欢迎卡 */
  .empty { text-align: center; padding: 56px 24px 30px; }
  .empty .hello {
    width: 52px; height: 52px; margin: 0 auto 14px; border-radius: 16px;
    background: linear-gradient(135deg, #3b6fe0, #7ba3f0);
    display: flex; align-items: center; justify-content: center;
    color: #fff; font-size: 24px; box-shadow: 0 8px 20px rgba(59,111,224,.28);
  }
  .empty h2 { margin: 0 0 6px; font-size: 18px; }
  .empty p { margin: 0 0 22px; color: var(--muted); font-size: 13px; }
  .chips { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; }
  .chip {
    background: var(--panel); border: 1px solid var(--border); border-radius: 999px;
    padding: 8px 16px; font-size: 13px; cursor: pointer; color: var(--chip-text);
    transition: all .15s ease;
  }
  .chip:hover { border-color: var(--brand); color: var(--brand); background: var(--brand-soft); }

  /* 消息 */
  .msg { max-width: 760px; margin: 0 auto 20px; position: relative; }
  .msg .who { font-size: 12px; color: var(--muted); margin-bottom: 6px; display: flex; gap: 8px; align-items: center; }
  .msg .who .time { font-size: 11px; opacity: .8; }
  .bubble {
    background: var(--panel); border: 1px solid var(--border);
    border-radius: var(--radius); padding: 13px 16px;
    line-height: 1.7; box-shadow: var(--shadow-bubble);
    word-break: break-word;
  }
  .bubble .txt { white-space: pre-wrap; }
  .msg.me { text-align: right; }
  .msg.me .who { justify-content: flex-end; }
  .msg.me .bubble {
    display: inline-block; text-align: left;
    background: var(--brand-soft); border-color: var(--brand-line); box-shadow: none;
  }
  .msg.sys .bubble {
    background: var(--warn-bg); border-color: var(--warn-line); color: var(--warn-text);
    font-size: 13px; text-align: center; display: inline-block; width: 100%;
  }
  .msg.sys { text-align: center; }

  /* 消息复制按钮：hover 时浮现 */
  .copy-msg {
    position: absolute; top: 24px; right: 8px;
    border: 1px solid var(--border); background: var(--panel);
    border-radius: 8px; padding: 3px 8px; font-size: 11px; color: var(--muted);
    cursor: pointer; opacity: 0; transition: opacity .15s ease; z-index: 2;
  }
  .msg.me .copy-msg { right: auto; left: 8px; }
  .msg:hover .copy-msg { opacity: 1; }
  .copy-msg:hover { color: var(--brand); border-color: var(--brand); }
  .copy-msg.copied { color: var(--ok); border-color: var(--ok); opacity: 1; }

  /* 代码块 + 复制 */
  .code-block {
    position: relative; margin: 8px 0;
    background: var(--code-bg); border: 1px solid var(--border);
    border-radius: 10px; overflow: hidden;
  }
  .code-block pre {
    margin: 0; padding: 12px 14px; font-size: 12.5px; line-height: 1.65;
    color: var(--code-text); overflow-x: auto;
    font-family: ui-monospace, Menlo, Consolas, "Courier New", monospace;
    white-space: pre;
  }
  .code-copy {
    position: absolute; top: 6px; right: 6px;
    border: 1px solid var(--border); background: var(--panel);
    border-radius: 7px; padding: 2px 8px; font-size: 11px; color: var(--muted);
    cursor: pointer;
  }
  .code-copy:hover { color: var(--brand); border-color: var(--brand); }
  .code-copy.copied { color: var(--ok); border-color: var(--ok); }
  .inline-code {
    background: var(--code-bg); color: var(--code-text);
    padding: 1px 6px; border-radius: 6px; font-size: .92em;
    font-family: ui-monospace, Menlo, Consolas, monospace;
  }

  /* 工具轨迹 */
  .trace {
    margin-top: 8px; border: 1px solid var(--border); border-radius: 10px;
    background: var(--panel-2); overflow: hidden;
  }
  .trace-head {
    padding: 7px 12px; font-size: 12px; color: var(--muted);
    border-bottom: 1px solid var(--border); background: var(--panel);
    display: flex; justify-content: space-between;
  }
  .trace-item {
    display: flex; align-items: center; gap: 8px;
    padding: 7px 12px; font-size: 12px; color: var(--text-2);
    cursor: pointer; user-select: none;
  }
  .trace-item + .trace-item { border-top: 1px dashed var(--border); }
  .trace-item:hover { background: var(--hover-bg); }
  .trace-item .st { font-size: 12px; }
  .trace-item .t-name { font-weight: 600; color: var(--text); }
  .trace-item .t-args {
    color: var(--muted); flex: 1; overflow: hidden;
    text-overflow: ellipsis; white-space: nowrap;
  }
  .trace-item .t-conf { color: var(--err); }
  .trace-item .t-conf.ok { color: var(--ok); }
  .trace-item .t-ms { color: var(--muted); font-size: 11px; }
  .trace-item .caret {
    color: var(--muted); font-size: 10px; transition: transform .15s ease; flex-shrink: 0;
  }
  .trace-out {
    display: none; margin: 0; padding: 8px 12px 10px 28px;
    font-size: 11px; line-height: 1.6; color: var(--text-2);
    background: var(--panel-2); border-top: 1px dashed var(--border);
    white-space: pre-wrap; word-break: break-all; font-family: ui-monospace, Menlo, Consolas, monospace;
  }
  .trace-out.show { display: block; }

  .meta {
    font-size: 11px; color: var(--muted); margin-top: 8px;
    display: flex; gap: 10px; flex-wrap: wrap;
  }
  .meta span { background: var(--hover-bg); padding: 2px 8px; border-radius: 6px; }

  /* ---------- 输入区 ---------- */
  footer { padding: 14px 24px 20px; background: transparent; }
  .composer {
    max-width: 760px; margin: 0 auto; display: flex; gap: 10px; align-items: flex-end;
    background: var(--panel); border: 1px solid var(--border); border-radius: 16px;
    padding: 10px; box-shadow: var(--shadow-composer);
  }
  textarea {
    flex: 1; resize: none; border: none; outline: none;
    padding: 8px 10px; font: inherit; height: 52px; max-height: 160px;
    color: var(--text); background: transparent;
  }
  #send { border-radius: 12px; padding: 9px 18px; height: 40px; }
  #send:disabled { opacity: .55; cursor: not-allowed; }
  .hdr-right { display: flex; align-items: center; gap: 10px; }
  .hdr-left { display: flex; align-items: center; gap: 10px; }
  .icon-btn {
    border: 1px solid var(--border); background: var(--panel); border-radius: 10px;
    padding: 6px 12px; font-size: 12px; cursor: pointer; color: var(--text-2);
    transition: all .15s ease; white-space: nowrap;
  }
  .icon-btn:hover { border-color: var(--brand); color: var(--brand); }
  .icon-btn.active {
    background: var(--brand-soft); border-color: var(--brand); color: var(--brand);
  }
  #mic { align-self: flex-end; height: 40px; border-radius: 12px; }
  #mic.active { animation: pulse 1.2s infinite; }
  @keyframes pulse { 0%,100% { box-shadow: 0 0 0 0 rgba(59,111,224,.35) } 50% { box-shadow: 0 0 0 6px rgba(59,111,224,0) } }

  /* 汉堡按钮：仅窄屏显示 */
  #menuBtn { display: none; }

  /* 侧边栏遮罩（窄屏抽屉用） */
  .side-mask {
    position: fixed; inset: 0; background: var(--mask);
    display: none; z-index: 25;
  }
  .side-mask.show { display: block; }

  /* ---------- 确认弹窗 ---------- */
  .mask {
    position: fixed; inset: 0; background: var(--mask);
    display: none; align-items: center; justify-content: center; z-index: 40;
    backdrop-filter: blur(2px);
  }
  .mask.show { display: flex; }
  .dialog {
    background: var(--panel); border: 1px solid var(--border); border-radius: 16px;
    padding: 22px; width: 440px; max-width: calc(100vw - 40px);
    box-shadow: var(--shadow-dialog);
  }
  .dialog h3 { margin: 0 0 6px; font-size: 15px; display: flex; align-items: center; gap: 8px; }
  .dialog .warn-ico {
    width: 26px; height: 26px; border-radius: 8px; background: var(--err-soft);
    color: var(--err); display: inline-flex; align-items: center; justify-content: center;
    font-size: 14px; flex-shrink: 0;
  }
  .dialog p { margin: 0 0 10px; font-size: 13px; color: var(--text-2); }
  .dialog pre {
    background: var(--bg); border: 1px solid var(--border); border-radius: 10px;
    padding: 12px; font-size: 12px; overflow-x: auto; margin: 0 0 16px; line-height: 1.6;
  }
  .dialog .row { display: flex; gap: 10px; justify-content: flex-end; }

  .typing { color: var(--muted); font-size: 13px; }
  .typing .b { display: inline-block; width: 5px; height: 5px; border-radius: 50%;
    background: var(--muted); margin-right: 3px; animation: blink 1.2s infinite; }
  .typing .b:nth-child(2) { animation-delay: .2s; }
  .typing .b:nth-child(3) { animation-delay: .4s; }
  .typing .waited { font-size: 11px; opacity: .75; margin-left: 6px; }
  @keyframes blink { 0%, 60%, 100% { opacity: .25 } 30% { opacity: 1 } }

  ::-webkit-scrollbar { width: 8px; }
  ::-webkit-scrollbar-thumb { background: var(--scroll); border-radius: 4px; }
  ::-webkit-scrollbar-thumb:hover { background: var(--scroll-hover); }

  /* ---------- 响应式：窄屏把侧边栏收成抽屉 ---------- */
  @media (max-width: 960px) {
    aside {
      position: fixed; left: 0; top: 0; bottom: 0;
      transform: translateX(-100%); transition: transform .22s ease;
      box-shadow: var(--shadow-dialog);
    }
    aside.open { transform: translateX(0); }
    #menuBtn { display: inline-flex; }
    header { padding: 12px 14px; }
    header .hint { display: none; }
    #chat { padding: 20px 14px 12px; }
    footer { padding: 10px 12px 14px; }
    .copy-msg { opacity: .55; }  /* 触屏没有 hover，弱化常显 */
  }
</style>
</head>
<body>
<aside id="sidebar">
  <div class="brand">
    <span class="logo">枢</span><h1>小枢 · MCP 智能体</h1>
    <p class="sub"><span class="dot"></span><span id="modelInfo">连接中…</span></p>
  </div>
  <div class="sec">
    <h2>会话</h2>
    <button class="btn btn-ghost" id="newSession" style="width:100%">＋ 新建会话</button>
  </div>
  <div class="sec">
    <h2>模型设置 · 自带 KEY</h2>
    <input id="llmKey" type="password" class="keyinput" placeholder="粘贴 DeepSeek API Key（选填）" autocomplete="off" spellcheck="false" />
    <p class="keyhint">填入你自己的 DeepSeek Key，即可在本页使用真实模型对话；Key 仅保存在<b>你的浏览器</b>本地，不会上传或写入服务器。留空则使用内置演示模型。</p>
    <p class="keystate" id="keyState"></p>
  </div>
  <div class="sec" style="flex:1; min-height:0; display:flex; flex-direction:column;">
    <h2>可用工具 · MCP SERVER</h2>
    <div class="tools" id="tools"></div>
  </div>
</aside>
<div class="side-mask" id="sideMask"></div>

<main>
  <header>
    <div class="hdr-left">
      <button class="icon-btn" id="menuBtn" title="打开侧栏">☰</button>
      <span class="title">对话</span>
    </div>
    <div class="hdr-right">
      <span class="hint">危险操作会先征得你同意 · 点击工具轨迹可展开返回值</span>
      <button class="icon-btn" id="tts" title="开启朗读">🔈 朗读</button>
      <button class="icon-btn" id="themeBtn" title="切换深浅色主题">🌙 深色</button>
    </div>
  </header>

  <div id="chat"><div class="wrap" id="chatInner"></div></div>

  <footer>
    <div class="composer">
      <button class="icon-btn" id="mic" title="语音输入（点击开始说话，说完自动发送）">🎤</button>
      <textarea id="input" placeholder="输入指令，Enter 发送，Shift+Enter 换行；也可点 🎤 语音输入"></textarea>
      <button class="btn btn-primary" id="send">发送</button>
    </div>
  </footer>
</main>

<div class="mask" id="mask">
  <div class="dialog">
    <h3><span class="warn-ico">!</span>危险操作需要你确认</h3>
    <p>智能体请求执行以下工具，请核对参数后决定是否允许（45 秒未操作将自动按拒绝处理）：</p>
    <pre id="confirmBody"></pre>
    <div class="row">
      <button class="btn" id="deny">拒绝</button>
      <button class="btn btn-primary" id="allow">允许执行</button>
    </div>
  </div>
</div>

<script>
const $ = (s) => document.querySelector(s);
let sessionId = null;
let polling = null;
let sending = false;

const SAMPLES = [
  "查一下北京的天气",
  "添加待办：周五前完成作业提交",
  "列出我的待办",
  "看看 workspace 目录里有什么",
  "统计一下 workspace/sales_demo.csv",
];

/* 轮询保护：总时长上限与连续失败上限。防止任何网络/服务端异常让页面永远转圈 */
const POLL_TIMEOUT_MS = 240000;   // 4 分钟总上限（覆盖后端 200s 看门狗 + 余量）
const POLL_MAX_FAILS = 6;         // 连续 fetch 失败这么多次就报错恢复

function nowTime() {
  const d = new Date();
  return d.getHours().toString().padStart(2,'0') + ":" + d.getMinutes().toString().padStart(2,'0');
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, (m) =>
    ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[m]));
}

/* ---------- 复制能力（消息 / 代码块共用） ---------- */
async function copyText(text, btn) {
  let ok = false;
  try {
    await navigator.clipboard.writeText(text);
    ok = true;
  } catch (e) {
    // 老浏览器 / 非 https 环境的降级方案
    try {
      const ta = document.createElement('textarea');
      ta.value = text;
      ta.style.position = 'fixed';
      ta.style.opacity = '0';
      document.body.appendChild(ta);
      ta.select();
      ok = document.execCommand('copy');
      ta.remove();
    } catch (e2) { ok = false; }
  }
  if (btn) {
    const old = btn.textContent;
    btn.textContent = ok ? '✓ 已复制' : '复制失败';
    btn.classList.add('copied');
    setTimeout(() => { btn.textContent = old; btn.classList.remove('copied'); }, 1200);
  }
}

/* ---------- 深浅色主题 ---------- */
function applyTheme(theme) {
  document.documentElement.setAttribute('data-theme', theme);
  $('#themeBtn').textContent = theme === 'dark' ? '☀️ 浅色' : '🌙 深色';
  $('#themeBtn').title = theme === 'dark' ? '切换为浅色主题' : '切换为深色主题';
  localStorage.setItem('theme', theme);
}
function initTheme() {
  const saved = localStorage.getItem('theme');
  const theme = saved || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
  applyTheme(theme);
  $('#themeBtn').onclick = () => {
    applyTheme(document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark');
  };
}

/* ---------- 窄屏侧边栏抽屉 ---------- */
function initDrawer() {
  const side = $('#sidebar'), mask = $('#sideMask');
  $('#menuBtn').onclick = () => { side.classList.add('open'); mask.classList.add('show'); };
  mask.onclick = () => { side.classList.remove('open'); mask.classList.remove('show'); };
}

/* ---------- 语音：输入（Web Speech 识别）与朗读（浏览器 TTS），零依赖 ---------- */
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
let recog = null;
let ttsOn = false;

function speak(text) {
  if (!ttsOn || !('speechSynthesis' in window) || !text) return;
  try {
    window.speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text.slice(0, 220));
    u.lang = 'zh-CN';
    u.rate = 1.05;
    window.speechSynthesis.speak(u);
  } catch (e) { /* 浏览器不支持时静默忽略，不影响对话 */ }
}

function initVoice() {
  const mic = $('#mic');
  const tts = $('#tts');
  if (!mic) return;

  if (!SR) {
    mic.style.display = 'none';                  // 不支持识别的浏览器直接隐藏麦克风
  } else {
    mic.onclick = () => {
      if (recog) { recog.stop(); recog = null; mic.classList.remove('active'); return; }
      recog = new SR();
      recog.lang = 'zh-CN';
      recog.interimResults = true;
      recog.continuous = false;
      let finalTxt = '';
      mic.classList.add('active');
      recog.onresult = (e) => {
        let interim = '';
        for (let i = e.resultIndex; i < e.results.length; i++) {
          const t = e.results[i][0].transcript;
          if (e.results[i].isFinal) finalTxt += t; else interim += t;
        }
        $('#input').value = finalTxt + interim;
        autoGrow();
      };
      recog.onend = () => {
        recog = null;
        mic.classList.remove('active');
        const v = $('#input').value.trim();
        if (v) send();                            // 说完自动发送，体验更连贯
      };
      recog.onerror = () => { recog = null; mic.classList.remove('active'); };
      recog.start();
    };
  }

  if (!('speechSynthesis' in window)) {
    if (tts) tts.style.display = 'none';
  } else if (tts) {
    tts.onclick = () => {
      ttsOn = !ttsOn;
      tts.classList.toggle('active', ttsOn);
      tts.title = ttsOn ? '关闭朗读' : '开启朗读';
      if (!ttsOn) window.speechSynthesis.cancel();
    };
  }
}

/* ---------- 自带 Key 模式 ---------- */
function currentKey() { return ($('#llmKey').value || '').trim(); }
function updateKeyState() {
  const k = currentKey();
  $('#keyState').textContent = k
    ? '✓ 已启用你的 Key · 对话将使用 DeepSeek 真实模型'
    : '当前：内置演示模型（规则路由，无需 Key）';
  $('#modelInfo').textContent = k ? '模型：deepseek-chat（你的 Key）' : '模型：mock-rule-v1';
}
$('#llmKey').addEventListener('input', updateKeyState);
$('#llmKey').addEventListener('change', () => {
  const k = currentKey();
  if (k) localStorage.setItem('llm_key', k); else localStorage.removeItem('llm_key');
  updateKeyState();
});
(function restoreKey() {
  const k = localStorage.getItem('llm_key');
  if (k) $('#llmKey').value = k;
})();

function hideEmpty() { const e = $('#empty'); if (e) e.remove(); }

function showEmpty() {
  const el = document.createElement('div');
  el.className = 'empty';
  el.id = 'empty';
  el.innerHTML = `
    <div class="hello">枢</div>
    <h2>你好，我是小枢</h2>
    <p>说一句话，我就能查天气、记待办、处理文件。试试下面几个例子：</p>
    <div class="chips">${SAMPLES.map(s => `<span class="chip">${s}</span>`).join('')}</div>`;
  $('#chatInner').appendChild(el);
  el.querySelectorAll('.chip').forEach(c => {
    c.onclick = () => { $('#input').value = c.textContent; $('#input').focus(); send(); };
  });
}

/* ---------- 气泡渲染：支持 ``` 代码块与 `行内代码`，代码块带复制按钮 ---------- */
function renderBubble(bubble, text) {
  bubble.innerHTML = '';
  const parts = String(text || '').split(/```/);
  parts.forEach((seg, i) => {
    if (i % 2 === 1) {
      // 代码块：第一行若是语言名则去掉
      let code = seg.replace(/^\n/, '');
      const firstNl = code.indexOf('\n');
      const maybeLang = code.slice(0, firstNl > 0 ? firstNl : 0).trim();
      if (maybeLang && /^[\w#+.-]{1,20}$/.test(maybeLang)) code = code.slice(firstNl + 1);
      const block = document.createElement('div');
      block.className = 'code-block';
      const pre = document.createElement('pre');
      pre.textContent = code.replace(/\n$/, '');
      const btn = document.createElement('button');
      btn.className = 'code-copy';
      btn.textContent = '复制';
      btn.onclick = () => copyText(pre.textContent, btn);
      block.appendChild(btn);
      block.appendChild(pre);
      bubble.appendChild(block);
    } else if (seg) {
      // 普通文本：处理 `行内代码`
      const span = document.createElement('span');
      span.className = 'txt';
      const frag = seg.split(/`([^`\n]+)`/g);
      frag.forEach((piece, j) => {
        if (j % 2 === 1) {
          const c = document.createElement('code');
          c.className = 'inline-code';
          c.textContent = piece;
          span.appendChild(c);
        } else if (piece) {
          span.appendChild(document.createTextNode(piece));
        }
      });
      bubble.appendChild(span);
    }
  });
}

function addMsg(who, text, trace, meta) {
  hideEmpty();
  if (who === '小枢' && text) speak(text);   // 开启朗读时自动播报助手回复
  const el = document.createElement('div');
  const cls = who === '我' ? ' me' : (who === '系统' ? ' sys' : '');
  el.className = 'msg' + cls;
  const inner = document.createElement('div');
  inner.innerHTML = `<div class="who">${who}<span class="time">${nowTime()}</span></div>`;
  const bubble = document.createElement('div');
  bubble.className = 'bubble';
  renderBubble(bubble, text);
  inner.appendChild(bubble);

  // 消息复制按钮（系统提示条不加）
  if (who !== '系统' && text) {
    const cp = document.createElement('button');
    cp.className = 'copy-msg';
    cp.textContent = '复制';
    cp.title = '复制这条消息';
    cp.onclick = () => copyText(text, cp);
    el.appendChild(cp);
  }

  if (trace && trace.length) {
    const t = document.createElement('div');
    t.className = 'trace';
    const okCount = trace.filter(c => c.ok).length;
    t.innerHTML = `<div class="trace-head"><span>工具调用轨迹</span><span>${okCount}/${trace.length} 成功</span></div>` +
      trace.map(c => {
        const flag = c.ok ? '✅' : '❌';
        const conf = c.confirmed === true ? '<span class="t-conf ok">已确认</span>'
                   : (c.confirmed === false ? '<span class="t-conf">已拒绝</span>' : '');
        const args = JSON.stringify(c.arguments || {});
        const short = args.length > 70 ? args.slice(0, 70) + '…' : args;
        // 工具返回值可展开：满足"可观测"要求——每一步的参数与真实返回都能逐条核对
        const out = c.output_preview
          ? `<pre class="trace-out">${escapeHtml(c.output_preview)}</pre>`
          : `<pre class="trace-out">（无返回预览）</pre>`;
        return `<div class="trace-item"><span class="st">${flag}</span><span class="t-name">${c.name}</span>` +
               `<span class="t-args">${escapeHtml(short)}</span>${conf}` +
               `<span class="t-ms">${c.duration_ms}ms</span><span class="caret">▶</span></div>${out}`;
      }).join('');
    inner.appendChild(t);
    t.querySelectorAll('.trace-item').forEach(row => {
      row.onclick = () => {
        const out = row.nextElementSibling;
        const open = out.classList.toggle('show');
        row.querySelector('.caret').style.transform = open ? 'rotate(90deg)' : '';
      };
    });
  }
  if (meta) {
    const m = document.createElement('div');
    m.className = 'meta';
    m.innerHTML = meta.map(x => `<span>${x}</span>`).join('');
    inner.appendChild(m);
  }
  el.appendChild(inner);
  $('#chatInner').appendChild(el);
  $('#chat').scrollTop = $('#chat').scrollHeight;
  return el;
}

async function loadTools() {
  const r = await fetch('/api/tools').then(x => x.json());
  $('#modelInfo').textContent = '模型：' + r.model;
  $('#tools').innerHTML = r.tools.map(t =>
    `<div class="tool"><code>${t.name}</code><span class="desc">${t.description}</span>` +
    (t.requires_confirm ? '<span class="badge-danger">需确认</span>' : '') + '</div>'
  ).join('');
}

async function newSession() {
  const r = await fetch('/api/sessions', { method: 'POST' }).then(x => x.json());
  sessionId = r.session_id;
  $('#chatInner').innerHTML = '';
  showEmpty();
  // 窄屏下新建会话后自动收起抽屉
  $('#sidebar').classList.remove('open');
  $('#sideMask').classList.remove('show');
}

function finishSend() {
  sending = false;
  $('#send').disabled = false;
}

async function send() {
  const text = $('#input').value.trim();
  if (!text || sending) return;
  sending = true;
  $('#send').disabled = true;
  if (!sessionId) await newSession();
  $('#input').value = '';
  autoGrow();
  addMsg('我', text);

  const waitEl = addMsg('小枢', '');
  const waitBubble = waitEl.querySelector('.bubble');
  waitBubble.innerHTML =
    '<span class="typing">思考中 <span class="b"></span><span class="b"></span><span class="b"></span>' +
    '<span class="waited">0s</span></span>';
  const startedAt = Date.now();
  // 等待时长可见：把"卡死"变成"看得见的等待"
  const waitedEl = waitBubble.querySelector('.waited');
  const waitedTimer = setInterval(() => {
    waitedEl.textContent = Math.floor((Date.now() - startedAt) / 1000) + 's';
  }, 1000);

  let res;
  try {
    const hdrs = { 'Content-Type': 'application/json' };
    const userKey = currentKey();
    if (userKey) hdrs['X-LLM-Key'] = userKey;
    res = await fetch('/api/chat', {
      method: 'POST', headers: hdrs,
      body: JSON.stringify({ message: text, session_id: sessionId })
    }).then(x => x.json());
  } catch (e) {
    clearInterval(waitedTimer);
    waitEl.remove();
    addMsg('系统', '发送失败：无法连接服务（' + e.message + '）。请确认服务已启动后重试。');
    finishSend();
    return;
  }
  if (res.task_id == null) {
    clearInterval(waitedTimer);
    waitEl.remove();
    addMsg('系统', '发送失败：' + (res.detail || JSON.stringify(res)));
    finishSend();
    return;
  }
  sessionId = res.session_id;

  let failCount = 0;
  const tick = async () => {
    let t;
    try {
      t = await fetch('/api/task/' + res.task_id).then(x => x.json());
      failCount = 0;
    } catch (e) {
      // 网络抖动不致命：连续失败超上限才报错，否则继续等
      failCount++;
      if (failCount >= POLL_MAX_FAILS) {
        clearInterval(waitedTimer);
        waitEl.remove();
        addMsg('系统', '获取结果失败（连续 ' + failCount + ' 次无法连接服务）。请刷新页面或重启服务后重试。');
        finishSend();
        return;
      }
      polling = setTimeout(tick, 1500);
      return;
    }
    if (t.status === 'awaiting_confirm') {
      showConfirm(res.task_id, t.confirm);
      polling = setTimeout(tick, 1000);
      return;
    }
    if (t.status === 'running') {
      if (Date.now() - startedAt > POLL_TIMEOUT_MS) {
        clearInterval(waitedTimer);
        waitEl.remove();
        addMsg('系统', '响应超时（超过 ' + Math.floor(POLL_TIMEOUT_MS / 1000) + ' 秒）。服务端可能正忙，请重试。');
        finishSend();
        return;
      }
      polling = setTimeout(tick, 700);
      return;
    }
    clearInterval(waitedTimer);
    waitEl.remove();
    if (t.status === 'error') {
      addMsg('小枢', '执行出错：' + t.error);
    } else if (!t.result) {
      addMsg('系统', '服务返回了无法识别的响应：' + JSON.stringify(t).slice(0, 200));
    } else {
      const r = t.result;
      const meta = [
        r.stop_reason_cn,
        r.wall_ms + 'ms',
        'tokens≈' + r.prompt_tokens,
        'trace ' + r.trace_id,
      ];
      if (r.degraded) meta.push('已降级到 Mock');
      addMsg('小枢', r.text, r.tool_calls, meta);
    }
    finishSend();
  };
  tick();
}

let currentTask = null;
function showConfirm(taskId, confirm) {
  if (!confirm) return;
  currentTask = taskId;
  $('#confirmBody').textContent = confirm.tool + '\n' + JSON.stringify(confirm.arguments, null, 2);
  $('#mask').classList.add('show');
}

async function resolveConfirm(approved) {
  if (!currentTask) return;
  $('#mask').classList.remove('show');
  await fetch('/api/confirm', {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ task_id: currentTask, approved })
  });
  currentTask = null;
}

function autoGrow() {
  const ta = $('#input');
  ta.style.height = '52px';
  ta.style.height = Math.min(160, ta.scrollHeight) + 'px';
}

$('#send').onclick = send;
$('#allow').onclick = () => resolveConfirm(true);
$('#deny').onclick = () => resolveConfirm(false);
$('#newSession').onclick = newSession;
$('#input').addEventListener('input', autoGrow);
$('#input').addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); }
});

initTheme();
initDrawer();
loadTools();
newSession();
updateKeyState();
initVoice();
</script>
